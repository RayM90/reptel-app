<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepTel — Sala de Espera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0D1B2A;
      color: #ffffff;
      min-height: 100vh;
    }
    header {
      background: #1E3A5F;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #2E86DE;
    }
    .logo { font-size: 36px; font-weight: 900; letter-spacing: 6px; color: #fff; }
    .logo span { color: #2E86DE; }
    .header-right { text-align: right; }
    .clock { font-size: 28px; font-weight: 600; color: #2E86DE; }
    .date { font-size: 14px; color: #A8C4E0; margin-top: 4px; }
    .subtitle {
      text-align: center;
      padding: 16px;
      font-size: 18px;
      color: #A8C4E0;
      background: #162636;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      padding: 30px 40px;
    }
    .order-card {
      background: #1A2F45;
      border-radius: 12px;
      padding: 20px;
      border-left: 6px solid #2E86DE;
      transition: transform 0.2s;
    }
    .order-card:hover { transform: scale(1.02); }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .order-number { font-size: 18px; font-weight: 700; color: #2E86DE; }
    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .client-name { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .device-info { font-size: 15px; color: #A8C4E0; margin-bottom: 6px; }
    .problem { font-size: 14px; color: #7F9BB5; }
    .received-at { font-size: 12px; color: #5A7A95; margin-top: 8px; }
    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: #4A6A85;
    }
    .empty-state h2 { font-size: 28px; margin-bottom: 12px; }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #162636;
      padding: 10px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #4A6A85;
      border-top: 1px solid #1E3A5F;
    }
    .pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #2ECC71;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">REP<span>TEL</span></div>
    <div class="header-right">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <div class="subtitle">Estado de reparaciones</div>

  <div class="orders-grid" id="orders-container">
    <div class="empty-state">
      <h2>Cargando órdenes...</h2>
    </div>
  </div>

  <footer>
    <div><span class="pulse"></span> Sistema en línea</div>
    <div id="last-update">Última actualización: --</div>
    <div>RepTel Servicio Técnico</div>
  </footer>
<script>
    const STATUS_LABELS = {
      RECEIVED: 'Recibido',
      DIAGNOSING: 'Diagnosticando',
      WAITING_APPROVAL: 'Esperando aprobación',
      APPROVED: 'Aprobado',
      REPAIRING: 'En reparación',
      READY: '¡Listo para retirar!',
      DELIVERED: 'Entregado',
      CANCELLED: 'Cancelado'
    }

    const STATUS_COLORS = {
      RECEIVED: '#3498DB',
      DIAGNOSING: '#9B59B6',
      WAITING_APPROVAL: '#F39C12',
      APPROVED: '#27AE60',
      REPAIRING: '#E67E22',
      READY: '#2ECC71',
      DELIVERED: '#95A5A6',
      CANCELLED: '#E74C3C'
    }

    function updateClock() {
      const now = new Date()
      document.getElementById('clock').textContent = now.toLocaleTimeString('es-VE')
      document.getElementById('date').textContent = now.toLocaleDateString('es-VE', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      })
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('es-VE', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      })
    }

    async function loadOrders() {
      try {
        const response = await fetch('/api/orders')
        const data = await response.json()
        const orders = data.data.filter(o =>
          o.status !== 'DELIVERED' && o.status !== 'CANCELLED'
        )
        renderOrders(orders)
        document.getElementById('last-update').textContent =
          'Última actualización: ' + new Date().toLocaleTimeString('es-VE')
      } catch (error) {
        console.error('Error cargando órdenes:', error)
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('orders-container')
      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No hay órdenes activas</h2>
            <p>Todas las reparaciones han sido completadas</p>
          </div>`
        return
      }
      container.innerHTML = orders.map(order => `
        <div class="order-card" style="border-left-color: ${STATUS_COLORS[order.status]}">
          <div class="order-header">
            <span class="order-number">${order.orderNumber}</span>
            <span class="status-badge" style="background: ${STATUS_COLORS[order.status]}20; color: ${STATUS_COLORS[order.status]}">
              ${STATUS_LABELS[order.status]}
            </span>
          </div>
          <div class="client-name">${order.client?.name || 'Cliente'}</div>
          <div class="device-info">${order.device?.brand} ${order.device?.model}</div>
          <div class="problem">${order.problem}</div>
          <div class="received-at">Recibido: ${formatDate(order.receivedAt)}</div>
        </div>
      `).join('')
    }

    // ── WebSocket conexión en tiempo real ──
    function connectWebSocket() {
      const ws = new WebSocket(`ws://${window.location.host}`)

      ws.onopen = () => {
        console.log('WebSocket conectado')
        document.getElementById('last-update').textContent =
          'Conectado en tiempo real: ' + new Date().toLocaleTimeString('es-VE')
      }

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data)
        if (
          message.type === 'ORDER_CREATED' ||
          message.type === 'ORDER_STATUS_UPDATED' ||
          message.type === 'ORDER_BUDGET_UPDATED'
        ) {
          loadOrders()
        }
      }

      ws.onclose = () => {
        console.log('WebSocket desconectado, reconectando en 3s...')
        setTimeout(connectWebSocket, 3000)
      }

      ws.onerror = (error) => {
        console.error('WebSocket error:', error)
      }
    }

    setInterval(updateClock, 1000)
    setInterval(loadOrders, 30000)
    updateClock()
    loadOrders()
    connectWebSocket()
</script>
</body>
</html>
